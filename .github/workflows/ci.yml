name: Pipeline da calculadora

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-security:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar a calculadora
        run: javac --add-modules jdk.httpserver Calculadora.java

      - name: Instalar o Semgrep (SAST)
        run: python -m pip install semgrep

      - name: Verificar o código com Semgrep
        run: semgrep scan --config p/java --error Calculadora.java

      - name: Colocar a calculadora no ar
        run: |
          nohup java --add-modules jdk.httpserver Calculadora > server.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo "Calculadora iniciada com sucesso."
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health

      - name: Testar a calculadora com OWASP ZAP (DAST)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I

      - name: Guardar os relatórios do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp-zap
          path: |
            zap-report.html
            zap-report.json
          if-no-files-found: warn
